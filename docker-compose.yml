services:
  # Backend API
  api:
    build:
      context: ./follow-server
      dockerfile: Dockerfile
    container_name: follow-api
    ports:
      - "5000:5000"
    volumes:
      - follow-data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/follow.db
      - Jwt__Secret=${JWT_SECRET:-your-super-secret-key-change-in-production-at-least-32-chars}
      - Jwt__Issuer=Follow
      - Jwt__Audience=Follow
      - Admin__Email=${ADMIN_EMAIL:-admin@example.com}
      - Admin__Password=${ADMIN_PASSWORD:-Admin@123}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Admin Dashboard
  admin:
    build:
      context: ./follow-admin
      dockerfile: Dockerfile
    container_name: follow-admin
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  follow-data:
    driver: local
